<style>

<script>
(() => {
  // ---------- state ----------
  const COLS = ["moto", "interventi", "documenti", "ricambi", "spostamenti"];

  function uploadDoc(motoIdX) {
    if (!navigator.onLine) { toast("Senza rete non puoi caricare documenti: riprova quando torna la connessione."); return; }

    inp.type = "file"; inp.accept = "image/*,application/pdf,.txt,.csv";
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      if (file.size > 20 * 1024 * 1024) { toast("Il file supera i 20 MB."); return; }
      toast("Caricamento in corso…");
      try {
        const safe = file.name.normalize("NFD").replace(/[^\w.\-]+/g, "_").slice(-80);
        const path = `${motoIdX}/${Date.now()}-${safe}`;
        const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined });
        if (error) throw error;
        await save("documenti", null, { motoId: motoIdX, nome: file.name, path, tipo: file.type, dimensione: file.size, data: today() });

  // ---------- calendar export (.ics with reminders 30 and 7 days before) ----------
  function icsFor(list) {
    const ymd = s => s.replace(/-/g, "");
    const next = s => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10).replace(/-/g, ""); };
    const now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const escI = s => String(s).replace(/[\\;,]/g, m => "\\" + m);
    const ev = list.map(s => [
      "BEGIN:VEVENT",
      `UID:garage-${s.moto.id}-${s.tipo.toLowerCase()}-${ymd(s.data)}`,
      `DTSTAMP:${now}`,
      `DTSTART;VALUE=DATE:${ymd(s.data)}`,
      `DTEND;VALUE=DATE:${next(s.data)}`,
      `SUMMARY:${escI(`Scadenza ${s.tipo.toLowerCase()} – ${s.moto.numero != null ? "N. " + s.moto.numero + " " : ""}${motoName(s.moto)}`)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escI(s.tipo + " in scadenza tra 30 giorni")}`, "TRIGGER:-P30D", "END:VALARM",
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escI(s.tipo + " in scadenza tra 7 giorni")}`, "TRIGGER:-P7D", "END:VALARM",
      "END:VEVENT"].join("\r\n"));
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Garage//IT", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
  }
  function downloadIcs(list, name) {
    if (!list.length) { toast("Nessuna data di scadenza inserita."); return; }
    const url = URL.createObjectURL(new Blob([icsFor(list)], { type: "text/calendar" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function vReport() {

    const totSp = perMoto.reduce((a, x) => a + x.v, 0);

    const ints = S.interventi.filter(i => yr === "tutti" || (i.data || "").startsWith(yr));
    const perTipo = {};
    ints.forEach(i => { perTipo[i.tipo || "Altro"] = (perTipo[i.tipo || "Altro"] || 0) + (Number(i.costo) || 0); });
    const tipi = Object.entries(perTipo).sort((a, b) => b[1] - a[1]);

    ${tipi.length ? `<div class="section"><h3>Per tipo di intervento</h3><div class="bars">${tipi.map(([t, v]) => bar(t, v, maxT)).join("")}</div></div>` : ""}
    ${yrs.length && S.moto.length ? `<div class="section"><h3>Anno per anno</h3><div class="scroll"><table><thead><tr><th>Moto</th>${yrs.map(y => `<th class="n">${y}</th>`).join("")}<th class="n">Totale</th></tr></thead><tbody>
      ${S.moto.map(m => `<tr><td>${esc(motoName(m))}</td>${yrs.map(y => `<td class="n">${fmtE(spesa(m.id, y))}</td>`).join("")}<td class="n"><b>${fmtE(spesa(m.id))}</b></td></tr>`).join("")}

    <div class="bar" style="margin-top:8px"><h2>Magazzino ricambi</h2></div>
    ${S.ricambi.length ? `<div class="section"><h3>Per fornitore</h3><div class="bars">${forn.map(([f, v]) => bar(f, v, maxF)).join("")}</div></div>
    <div class="section"><h3>I 5 articoli di maggior valore</h3><div class="scroll"><table><thead><tr><th>Ricambio</th><th class="n">Q.tà</th><th class="n">Prezzo</th><th class="n">Valore</th></tr></thead><tbody>

  const busy = new Set();
  async function bumpQty(id, d, el) {
    if (busy.has(id)) return;
    const r = S.ricambi.find(x => x.id === id); if (!r) return;
    const nq = Math.max(0, (Number(r.quantita) || 0) + d);
    if (nq === r.quantita) return;
    busy.add(id); el.disabled = true;
    try { await save("ricambi", id, { quantita: nq }); }
    catch (e) { toast(errMsg(e)); }
    finally { busy.delete(id); }
  }
  // ---------- swipe (come in Mail su iPhone) ----------
  const openX = (row) => Number(row.dataset.open || -168);
  let sw = null;
  const snap = (row, x) => {
    row.style.transition = ""; row.style.transform = x ? `translateX(${x}px)` : ""; row._open = x < 0;
    const p = row.parentElement; p.classList.toggle("right", false); clearTimeout(row._mt);
    if (x) p.classList.add("moving"); else row._mt = setTimeout(() => p.classList.remove("moving"), 260);
  };
  const closeOthers = (keep) => document.querySelectorAll("[data-swipe]").forEach(r => { if (r !== keep && r._open) snap(r, 0); });
  const swipeAction = (row) => { if (row.dataset.full === "sposta") formSposta(row.dataset.id); else formRinnova(row.dataset.id, row.dataset.key); };
  document.addEventListener("pointerdown", (e) => {
    const row = e.target.closest("[data-swipe]");
    if (!row || row.dataset.swipe !== "1" || (e.pointerType === "mouse" && e.button !== 0)) return;
    closeOthers(row);
    sw = { row, x: e.clientX, y: e.clientY, base: row._open ? openX(row) : 0, t: row._open ? openX(row) : 0, dragging: false, id: e.pointerId };
  });
  document.addEventListener("pointermove", (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.dragging) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.dragging = true; sw.row.style.transition = "none"; clearTimeout(sw.row._mt); sw.row.parentElement.classList.add("moving"); try { sw.row.setPointerCapture(sw.id); } catch (err) {} }
      else if (Math.abs(dy) > 10) { sw = null; return; }
      else return;
    }
    let t = Math.max(-260, Math.min(160, sw.base + dx));
    sw.t = t;
    sw.row.style.transform = `translateX(${t}px)`;
    sw.row.parentElement.classList.toggle("right", t > 0);
  });
  const endSwipe = (e) => {
    if (!sw || (e && e.pointerId !== sw.id)) return;
    const { row, dragging, t } = sw; sw = null;
    if (!dragging) return;
    row._justDragged = true; setTimeout(() => { row._justDragged = false; }, 80);
    if (t > 90 || t < -220) { snap(row, 0); swipeAction(row); }
    else if (t < -50) snap(row, openX(row));
    else snap(row, 0);
  };
  document.addEventListener("pointerup", endSwipe);
  document.addEventListener("pointercancel", (e) => { if (sw && sw.row) snap(sw.row, 0); sw = null; });

  document.addEventListener("click", (e) => {
    const srow = e.target.closest("[data-swipe]");
    if (srow && srow._justDragged) { e.preventDefault(); return; }
    if (srow && srow._open && !e.target.closest(".renew-desk")) { e.preventDefault(); snap(srow, 0); return; }
    if (!e.target.closest(".swipe")) closeOthers(null);
    const el = e.target.closest("[data-act]"); if (!el) return;
    const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset.id, el); }
  });

      e.preventDefault();
      const em = $("#se").value.trim(), pw = $("#sp").value, pw2 = $("#sp2").value;
      if (!/^\S+@\S+\.\S+$/.test(em)) { $("#lerr").textContent = "Inserisci un indirizzo email valido."; return; }
      if (pw.length < 8) { $("#lerr").textContent = "La password deve avere almeno 8 caratteri."; return; }
      if (pw !== pw2) { $("#lerr").textContent = "Le due password non coincidono."; return; }
      $("#lsub").disabled = true; $("#lerr").textContent = "";
      const { data, error } = await sb.auth.signUp({ email: em, password: pw, options: { data: { invito: inviteCode } } });
      if (error) {
        const m = error.message || "";
        $("#lerr").textContent = /registered|exists/i.test(m) ? "Esiste già un account con questa email: accedi."
          : /signups? not allowed|disabled/i.test(m) ? "Le nuove registrazioni sono disattivate. Chi gestisce l'app deve attivarle su Supabase (Allow new users to sign up)."
          : /rate limit|too many/i.test(m) ? "Troppi tentativi: riprova tra qualche minuto."
          : /password/i.test(m) ? "Password non accettata: usane una più lunga (almeno 8 caratteri)."
          : "Registrazione non riuscita: " + m;
        $("#lsub").disabled = false; return;
      }
      if (!data.session) { $("#lerr").textContent = "Account creato: controlla la tua email per confermarlo, poi accedi."; }
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
    };
  }
  async function openInvite() {
    $("#modal-root").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">
      <h2>Invita un collaboratore</h2>
      <p style="margin:0;color:var(--muted)">Manda questo link a chi deve usare il garage: aprendolo crea il suo account e vede subito moto e ricambi.</p>
      <div class="linkbox"><input id="ilink" readonly value="Caricamento…" aria-label="Link di invito"><button class="btn pri" id="icopy">Copia</button></div>
      <div class="err" id="merr"></div>
      <div class="modal-acts" style="justify-content:space-between;flex-wrap:wrap">
        <button class="btn danger" id="iregen">Disattiva e crea nuovo link</button>
        <div style="display:flex;gap:8px">${navigator.share ? `<button class="btn" id="ishare">Condividi</button>` : ""}<button class="btn" id="mcancel">Chiudi</button></div>
      </div></div></div>`;
    modalOpened();
    $("#mcancel").onclick = closeModal;
    $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") closeModal(); });
    const base = location.origin + location.pathname;
    const show = (c) => { $("#ilink").value = `${base}#invito-${c}`; };
    const { data, error } = await sb.rpc("codice_invito");
    if (error || !data) { $("#merr").textContent = "Non riesco a leggere il link di invito."; } else show(data);
    $("#icopy").onclick = async () => { try { await navigator.clipboard.writeText($("#ilink").value); toast("Link copiato"); } catch (e) { $("#ilink").select(); toast("Seleziona e copia il link"); } };
    if ($("#ishare")) $("#ishare").onclick = async () => { try { await navigator.share({ title: "Garage", text: "Ti invito a gestire moto e ricambi nel mio garage:", url: $("#ilink").value }); } catch (e) {} };
    $("#iregen").onclick = async () => {
      $("#iregen").disabled = true;
      const r = await sb.rpc("rigenera_invito");
      if (r.error) $("#merr").textContent = "Non riesco a creare un nuovo link."; else { show(r.data); toast("Nuovo link creato: quello vecchio non funziona più"); }
      $("#iregen").disabled = false;
    };
  }
  async function openCalendario() {
    $("#modal-root").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">
      <h2>Scadenze nel calendario</h2>
      <p style="margin:0;color:var(--muted)">Abbonati una volta sola: il calendario del telefono si aggiorna da solo quando cambi o rinnovi una data, con un avviso 30 e 7 giorni prima di ogni scadenza.</p>
      <a class="btn pri" id="csub" href="#" style="justify-content:center;padding:12px;text-decoration:none">Abbonati al calendario</a>
      <ol class="cal-steps">
        <li><b>iPhone:</b> tocca il pulsante e conferma "Iscriviti".</li>
        <li><b>Android / Google Calendar:</b> copia il link e in Google Calendar dal computer scegli "Altri calendari" → "Da URL".</li>
      </ol>
      <div class="linkbox"><input id="clink" readonly value="Caricamento…" aria-label="Link del calendario"><button class="btn" id="ccopy">Copia</button></div>
      <div class="err" id="merr"></div>
      <div class="modal-acts" style="justify-content:space-between;flex-wrap:wrap"><button class="btn" data-act="icsAll">Scarica file una tantum</button><button class="btn" id="mcancel">Chiudi</button></div>
    </div></div>`;
    modalOpened();
    $("#mcancel").onclick = closeModal;
    $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") closeModal(); });
    const { data, error } = await sb.rpc("calendario_link");
    if (error || !data) { $("#merr").textContent = "Non riesco a leggere il link del calendario."; return; }
    const cfg = window.GARAGE_CONFIG;
    const https = `${cfg.SUPABASE_URL}/rest/v1/rpc/calendario_ics?t=${data}&apikey=${cfg.SUPABASE_ANON_KEY}`;
    $("#clink").value = https;
    $("#csub").href = https.replace(/^https:/, "webcal:");
    $("#ccopy").onclick = async () => { try { await navigator.clipboard.writeText(https); toast("Link copiato"); } catch (e) { $("#clink").select(); toast("Seleziona e copia il link"); } };
  }
  // ---------- notifiche push ----------
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const b64ToU8 = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
  async function currentSub() { try { const reg = await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); } catch (e) { return null; } }
  async function openNotifiche() {
    const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const sub = supported ? await currentSub() : null;
    const on = !!sub && Notification.permission === "granted";
    let msg = "";
    if (!supported && isIOS && !isStandalone()) msg = `Su iPhone le notifiche funzionano solo dall'app aggiunta alla schermata Home: in Safari tocca <b>Condividi</b> → <b>Aggiungi alla schermata Home</b>, poi apri Garage dall'icona e torna qui.`;
    else if (!supported) msg = "Questo browser non supporta le notifiche. Su iPhone serve iOS 16.4 o successivo e l'app aggiunta alla schermata Home.";
    else if (Notification.permission === "denied") msg = "Le notifiche sono bloccate per Garage. Riattivale dalle impostazioni del telefono (Impostazioni → Notifiche → Garage) e riprova.";
    $("#modal-root").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">
      <h2>Notifiche</h2>
      <p style="margin:0;color:var(--muted)">Ogni mattina alle 8 controllo le scadenze: se un'assicurazione, un bollo o una revisione scade <b>tra 7 giorni</b>, ti arriva una notifica su questo dispositivo.</p>
      ${msg ? `<div class="note">${msg}</div>` : `<div class="note ${on ? "offline" : ""}">${on ? "Notifiche attive su questo dispositivo." : "Notifiche non attive su questo dispositivo."}</div>`}
      <div class="err" id="merr"></div>
      <div class="modal-acts" style="justify-content:space-between;flex-wrap:wrap">
        <div style="display:flex;gap:8px;flex-wrap:wrap">${!msg ? (on ? `<button class="btn" id="ntest">Invia una prova</button><button class="btn danger" id="noff">Disattiva</button>` : `<button class="btn pri" id="non">Attiva notifiche</button>`) : ""}</div>
        <button class="btn" id="mcancel">Chiudi</button>
      </div></div></div>`;
    modalOpened();
    $("#mcancel").onclick = closeModal;
    $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") closeModal(); });
    if ($("#non")) $("#non").onclick = async () => {
      $("#non").disabled = true; $("#merr").textContent = "";
      try {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") throw { userMsg: "Permesso negato: per riceverle consenti le notifiche quando il telefono te lo chiede." };
        const { data: key, error } = await sb.rpc("push_vapid"); if (error || !key) throw error || {};
        const reg = await navigator.serviceWorker.ready;
        const s = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
        const r = await sb.rpc("salva_push", { sub: s.toJSON() }); if (r.error) throw r.error;
        await fetch(window.GARAGE_CONFIG.SUPABASE_URL + "/functions/v1/notifiche", { method: "POST", headers: { Authorization: "Bearer " + session.access_token, apikey: window.GARAGE_CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ test: true }) }).catch(() => {});
        toast("Notifiche attivate"); openNotifiche();
      } catch (e) { $("#merr").textContent = (e && e.userMsg) || "Non sono riuscito ad attivare le notifiche. Riprova con la rete attiva."; $("#non").disabled = false; }
    };
    if ($("#ntest")) $("#ntest").onclick = async () => {
      $("#ntest").disabled = true;
      try {
        const s = await currentSub(); if (s) await sb.rpc("salva_push", { sub: s.toJSON() });
        const r = await fetch(window.GARAGE_CONFIG.SUPABASE_URL + "/functions/v1/notifiche", { method: "POST", headers: { Authorization: "Bearer " + session.access_token, apikey: window.GARAGE_CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ test: true }) });
        const j = await r.json(); toast(j.inviate ? "Prova inviata: arriva tra pochi secondi" : "Prova non riuscita: disattiva e riattiva le notifiche");
      } catch (e) { toast("Serve la rete per inviare la prova."); }
      $("#ntest").disabled = false;
    };
    if ($("#noff")) $("#noff").onclick = async () => {
      const s = await currentSub();
      if (s) { await sb.rpc("rimuovi_push", { endpoint: s.endpoint }).catch(() => {}); await s.unsubscribe().catch(() => {}); }
      toast("Notifiche disattivate"); openNotifiche();
    };
  }
  $("#notif").onclick = openNotifiche;
  $("#invite").onclick = openInvite;
  $("#logout").onclick = async () => { await sb.auth.signOut(); };
  const TEMI = [["auto", "◐", "automatico"], ["light", "☀︎", "chiaro"], ["dark", "☾", "scuro"]];
  function applyTema(t) {
    window.__garageTema.set(t);
    const [, icon, label] = TEMI.find(x => x[0] === t) || TEMI[0];
    $("#tema").textContent = icon; $("#tema").setAttribute("aria-label", "Tema: " + label); $("#tema").title = "Tema: " + label;
    document.querySelectorAll('meta[name="theme-color"]').forEach(mt => {
      if (t === "light") mt.setAttribute("content", "#f2f2f7"); else if (t === "dark") mt.setAttribute("content", "#1c1c1e");
      else mt.setAttribute("content", (mt.getAttribute("media") || "").includes("dark") ? "#1c1c1e" : "#f2f2f7");
    });
  }
  let tema = window.__garageTema.get();
  applyTema(tema);
  $("#tema").onclick = () => {
    tema = TEMI[(TEMI.findIndex(x => x[0] === tema) + 1) % TEMI.length][0];
    try { localStorage.setItem("garage-tema2", tema); } catch (e) {}
    applyTema(tema); toast("Tema: " + TEMI.find(x => x[0] === tema)[2]);
  };

  // ---------- data connection ----------
  let channel = null;
  const pending = {};
  async function checkMembro() {
    membro = null; render();
    const { data, error } = await sb.rpc("is_membro");
    if (error && isNetErr(error)) membro = lsGet("garage-membro", false);
    else { membro = error ? false : !!data; lsSet("garage-membro", membro); }
    if (inviteCode && membro) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    return membro;
  }
  async function loadAll() {
    if (!(await checkMembro())) { render(); return; }
    failed = false; loaded.clear();
    const hadCache = loadCache(); render();
    try { await Promise.all(COLS.map(fetchTable)); cachedAt = null; saveCache(); flush(); }
    catch (e) { if (!hadCache) failed = true; }
    render();
    if (channel) sb.removeChannel(channel);
    channel = sb.channel("garage");
    COLS.forEach(c => channel.on("postgres_changes", { event: "*", schema: "public", table: c }, () => {
      clearTimeout(pending[c]); pending[c] = setTimeout(() => fetchTable(c).then(() => { saveCache(); render(); }).catch(() => {}), 300);
    }));
    channel.subscribe();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && session && membro && navigator.onLine) { flush(); COLS.forEach(c => fetchTable(c).then(() => { saveCache(); render(); }).catch(() => {})); } });
  async function init() {
    const cfg = window.GARAGE_CONFIG || {};
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || /INSERISCI/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY) || !window.supabase) { setup = true; render(); return; }
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((ev, s) => {
      const was = !!session; session = s;
      if (ev === "PASSWORD_RECOVERY") { recovery = true; render(); return; }
      if (!s) { membro = null; try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem("garage-membro"); } catch (e) {} if (channel) { sb.removeChannel(channel); channel = null; } COLS.forEach(c => S[c] = []); loaded.clear(); render(); }
      else if (!was && !recovery) loadAll();
    });
    if (session && !recovery) loadAll(); else render();
  }
  init();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
